# The Linux builder's Docker image (linux/README.md), pushed to the GitHub Container Registry as ghcr.io/<owner>/nxnative-linux:
#   :latest from the default branch and from linux-builder, :<branch> for every branch it builds, :sha-<commit> for each commit.
# It holds no Apple file (the player installs those into the /data volume), so the image can be shared like the repository.
name: linux-image

on:
  push:
    branches: [main, linux-builder]
    paths: ['linux/**', 'dm/**', 'scripts/**', '.dockerignore', '.github/workflows/linux-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: linux-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    # The iOS launcher's Swift sources, compiled with Apple's compiler: SwiftUI's @State is a macro whose plugin only macOS runs (linux/swift/prebuilt.py). The object depends on no
    # game; the image carries it and linux/bin/xcodebuild links it when its key matches the checkout's sources.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the Swift sources for iOS
        run: |
          xcodebuild -version
          python3 linux/swift/prebuilt.py build linux/prebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: swift-prebuilt
          path: linux/prebuilt/
          retention-days: 7

  image:
    needs: swift
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space (the Swift, .NET and Wine layers need about 15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: swift-prebuilt
          path: linux/prebuilt/
      - name: Check the prebuilt Swift object against this checkout
        run: |
          cat linux/prebuilt/DmIOS-swift.json
          test "$(python3 linux/swift/prebuilt.py key)" = "$(python3 -c 'import json; print(json.load(open("linux/prebuilt/DmIOS-swift.json"))["key"])')"
      - name: Image name (lowercase owner)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nxnative-linux" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'linux-builder' || github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: linux/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
